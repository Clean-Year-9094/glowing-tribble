name: SteamOS kernel modules

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  MIRROR: https://steamdeck-packages.steamos.cloud/archlinux-mirror
  MIN_KVER: "6.11"   # Ignore kernel series older than this.
  KEEP: "20"         # Select up to this many headers packages per kernel series.

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/steamos-plan.py

  build:
    needs: discover
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      SERIES: ${{ matrix.series }}
      PACKAGES: ${{ matrix.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/modcache
          key: modcache-${{ matrix.series }}-${{ hashFiles('.github/scripts/steamos-build.sh', 'Makefile', 'inc/**', 'src/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            modcache-${{ matrix.series }}-${{ hashFiles('.github/scripts/steamos-build.sh', 'Makefile', 'inc/**', 'src/**') }}-
      - name: Build missing modules
        run: bash .github/scripts/steamos-build.sh
      - name: Upload ${{ matrix.series }} modules
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.series }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: steamos-module-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: modules-*
          path: out
          merge-multiple: true
      - name: Stage new or changed modules
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/steamos-plan.py publish
      - id: release_info
        if: steps.changes.outputs.publish == 'true'
        run: |
          echo "tag=v$(date -u +'%Y.%m.%d')-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
      - name: Create Release
        if: steps.changes.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "SteamOS ${{ steps.release_info.outputs.tag }}"
          body: |
            Incremental SteamOS module build created on ${{ steps.release_info.outputs.date }}.
            Modules for other kernels are available in earlier releases.
          target_commitish: ${{ github.sha }}
          files: |
            publish/*.ko
            publish/steamos-build-inputs-v1.tsv
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
