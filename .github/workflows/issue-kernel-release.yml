name: Build kernel module from issue
run-name: "Kernel module request issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: issue-kernel-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kernel: ${{ steps.input.outputs.kernel }}
      mode: ${{ steps.input.outputs.mode }}
      headers_url: ${{ steps.input.outputs.headers_url }}
      headers_sha256: ${{ steps.input.outputs.headers_sha256 }}
      error: ${{ steps.input.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate all issue fields before executing a build
        id: input
        run: python3 .github/scripts/issue-kernel-validate.py

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up ORAS for official OGC packages
        if: needs.validate.outputs.mode == 'ogc'
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
      - name: Build OGC module
        if: needs.validate.outputs.mode == 'ogc'
        env:
          KERNEL_VERSION: ${{ needs.validate.outputs.kernel }}
        run: bash .github/scripts/issue-kernel-ogc.sh
      - name: Build Arch module in a token-free container
        if: needs.validate.outputs.mode == 'arch'
        env:
          KERNEL_VERSION: ${{ needs.validate.outputs.kernel }}
          HEADERS_URL: ${{ needs.validate.outputs.headers_url }}
          HEADERS_SHA256: ${{ needs.validate.outputs.headers_sha256 }}
        run: |
          mkdir -p out
          docker run --rm --security-opt=no-new-privileges \
            --env KERNEL_VERSION --env HEADERS_URL --env HEADERS_SHA256 \
            --volume "$PWD:/work" --workdir /work archlinux:base \
            bash .github/scripts/issue-kernel-arch.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue-kernel-${{ github.event.issue.number }}
          path: |
            out/*.ko
            out/SHA256SUMS
            out/BUILD.md
            out/vermagic.txt
            out/toolchain.txt
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: issue-kernel-${{ github.event.issue.number }}
          path: out
      - name: Publish assets, reply, and close the exact request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          KERNEL_VERSION: ${{ needs.validate.outputs.kernel }}
          HEADERS_URL: ${{ needs.validate.outputs.headers_url }}
          HEADERS_SHA256: ${{ needs.validate.outputs.headers_sha256 }}
          MODE: ${{ needs.validate.outputs.mode }}
        run: |
          set -euo pipefail
          # An edited request must not be closed by an older build.
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" > current-issue.json
          python3 - <<'PY'
          import json, os, re
          issue = json.load(open('current-issue.json'))
          body = issue.get('body') or ''
          expected = {'Kernel release': os.environ['KERNEL_VERSION'],
                      'Headers package URL': os.environ['HEADERS_URL'],
                      'Headers SHA256': os.environ['HEADERS_SHA256']}
          if issue['state'] != 'open' or not issue['title'].startswith('[Kernel build]'):
              raise SystemExit('Issue is no longer an open kernel request')
          for name, value in expected.items():
              found = re.findall(r'^### ' + re.escape(name) + r'\r?\n\r?\n(.*?)(?=^### |\Z)', body, re.M | re.S)
              if len(found) != 1:
                  raise SystemExit('Issue fields changed; refusing to close this request')
              actual = found[0].strip()
              actual = '' if actual == '_No response_' else actual
              if name == 'Headers SHA256':
                  actual = actual.lower()
              if actual != value:
                  raise SystemExit('Issue fields changed; a newer run must handle this request')
          PY
          module="cpuid_fault_emulation-$KERNEL_VERSION.ko"
          test -s "out/$module"
          test "$(cut -d ' ' -f1 out/vermagic.txt)" = "$KERNEL_VERSION"
          expected=$(sha256sum "out/$module" | cut -d ' ' -f1)
          test "$(cat out/SHA256SUMS)" = "$expected  $module"
          # Release prose comes from the trusted workflow, never a build artifact.
          printf 'Module for `%s`.\n\nSource commit: `%s`.\nRequest: #%s.\n\nCompilation and vermagic checked; runtime not tested. Unsigned module; requires AMD SVM.\n' \
            "$KERNEL_VERSION" "$GITHUB_SHA" "$ISSUE_NUMBER" > notes.md
          tag="kernel-$KERNEL_VERSION-issue-$ISSUE_NUMBER-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
            --title "Kernel $KERNEL_VERSION" --notes-file notes.md \
            "out/$module" out/SHA256SUMS out/BUILD.md out/vermagic.txt out/toolchain.txt
          url=$(gh release view "$tag" --json url --jq .url)
          gh issue comment "$ISSUE_NUMBER" --body "Published the module for $KERNEL_VERSION: $url"
          gh issue close "$ISSUE_NUMBER" --reason completed

  report-failure:
    needs: [validate, build, release]
    if: >-
      always() && !cancelled() &&
      (needs.validate.result == 'failure' || needs.build.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - name: Explain failure and close the unchanged request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          VALIDATION_ERROR: ${{ needs.validate.outputs.error }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" > current-issue.json
          # Do not close a request that has been corrected while this run was working.
          python3 - <<'PY'
          import json, os
          previous = json.load(open(os.environ['GITHUB_EVENT_PATH']))['issue']
          current = json.load(open('current-issue.json'))
          if current.get('body') != previous.get('body') or current['title'] != previous['title']:
              raise SystemExit('Issue changed; leaving the newer request for its own workflow run')
          PY
          if [ -n "$VALIDATION_ERROR" ]; then
            reason="$VALIDATION_ERROR"
          elif [ "$VALIDATION_RESULT" = failure ]; then
            reason="Validation job failed before input validation could finish."
          elif [ "$BUILD_RESULT" = failure ]; then
            reason="Kernel package retrieval, checksum/header verification, compilation, or module vermagic verification failed."
          else
            reason="Release publication or issue completion failed."
          fi
          failed_steps=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | join("; ")' 2>/dev/null || true)
          printf 'Request closed because it could not be completed.\n\nReason: %s\n\nFailed steps: %s\n\nLogs: %s/%s/actions/runs/%s\n\nCorrect the request and reopen it to retry.\n' \
            "$reason" "${failed_steps:-See workflow logs}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > failure.md
          gh issue comment "$ISSUE_NUMBER" --body-file failure.md
          gh issue close "$ISSUE_NUMBER" --reason 'not planned'
